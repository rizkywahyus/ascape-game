spring.application.name=ascape-server
server.port=${PORT:8080}
# Local dev: read the repo-root .env (run from server/) as properties. Real deployments use env vars.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Comma-separated browser origins allowed to open the game WebSocket and call /api (CORS).
ascape.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Supabase Auth: tokens are verified against ${SUPABASE_URL}/auth/v1/.well-known/jwks.json.
ascape.auth.supabase-url=${SUPABASE_URL:}
# Accept WebSocket connections without a token (as guest-xxxx). Dev and load tests only.
ascape.auth.allow-unauthenticated=${AUTH_ALLOW_UNAUTHENTICATED:false}

# Persistence is enabled when DB_URL is set; otherwise profiles and stats live in memory.
ascape.persistence.jdbc-url=${DB_URL:}
ascape.persistence.username=${DB_USER:}
ascape.persistence.password=${DB_PASSWORD:}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Dev aid: extra one-way latency on every WebSocket message (0 = off). Try SIMULATED_LATENCY_MS=100.
ascape.debug.simulated-latency-ms=${SIMULATED_LATENCY_MS:0}

# Error responses as RFC 9457 problem details, so clients can show the reason ("detail").
spring.mvc.problemdetails.enabled=true

# Bot skill: easy, normal or hard.
ascape.bots.difficulty=${BOT_DIFFICULTY:normal}
# Dev aid: show every bot's state and A* path to all clients (F4). Reveals positions; never enable in production.
ascape.debug.bot-view=${BOT_DEBUG_VIEW:false}
