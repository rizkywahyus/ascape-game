# Render Blueprint for the game server (Dashboard → New → Blueprint, pick this repo).
# The client is a static site deployed separately to Vercel (see README → Deploying).
services:
  - type: web
    name: ascape-server
    runtime: docker
    plan: free
    region: singapore
    # Build context is the repo root: the server packages shared/ (rules, maps).
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/liveness
    autoDeploy: true
    buildFilter:
      paths:
        - server/**
        - shared/**
        - render.yaml
    envVars:
      # Your Vercel URL(s), comma-separated, e.g. https://ascape-game.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AUTH_ALLOW_UNAUTHENTICATED
        value: "false"
      - key: BOT_DIFFICULTY
        value: normal
